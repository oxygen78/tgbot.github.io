<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h1>Моё первое Mini App 🚀</h1>
  <button onclick="sendData()">Отправить данные боту</button>

  <script>
    const tg = window.Telegram.WebApp;

    tg.expand(); // разворачивает приложение

    function sendData() {
      tg.sendData("Привет от Mini App");
    }
  </script>
</body>
</html>
