<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Game Room</title>

  <!-- Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Socket.IO client -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

<h2>🎰 Игровая — комната</h2>
<div id="status"></div>
<div id="pot">Банк: 0</div>

<button onclick="makeBet()">Сделать ставку</button>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  // 🔹 пользователь Telegram
  const user = tg.initDataUnsafe.user || {
    id: Math.random(),
    first_name: "Guest"
  };

  const roomId = "room-1";

  // 🔹 подключение к серверу
  const socket = io("http://localhost:3000"); // В PROD — URL сервера

  socket.on("connect", () => {
    document.getElementById("status").innerText =
      "Подключён как " + user.first_name;

    socket.emit("join_room", {
      roomId,
      user: {
        id: user.id,
        name: user.first_name
      }
    });
  });

  socket.on("room_update", (room) => {
    document.getElementById("pot").innerText =
      "Банк: " + room.pot;
  });

  socket.on("bet_made", (data) => {
    document.getElementById("pot").innerText =
      "Банк: " + data.pot;
  });

  function makeBet() {
    socket.emit("bet", {
      roomId,
      amount: 10,
      user: {
        id: user.id,
        name: user.first_name
      }
    });
  }
</script>

</body>
</html>
